<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso · Slope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:   #07080F;
  --bg2:  #0D0E1A;
  --bg3:  #141526;
  --bg4:  #1B1C30;
  --x:    #7C83FD;
  --x2:   #5A62F0;
  --y:    #00D4A0;
  --acc:  #FF6B8A;
  --acc2: #FFC254;
  --txt:  #ECEDF8;
  --txt2: #8987A8;
  --txt3: #4E4C68;
  --brd:  #1C1D30;
  --brd2: #282944;
  --font-sans: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--txt);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.7;
  min-height: 100vh;
}

/* ── Topbar ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.055);
  backdrop-filter: blur(48px) saturate(200%) brightness(1.02);
  -webkit-backdrop-filter: blur(48px) saturate(200%) brightness(1.02);
  border-bottom: 1px solid rgba(255,255,255,0.09);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.13), 0 8px 32px rgba(0,0,0,0.2);
  display: flex; align-items: center; gap: 16px;
  padding: 0 28px; height: 52px;
}
.topbar-back {
  display: flex; align-items: center; gap: 8px;
  color: var(--txt2); text-decoration: none; font-size: 13px;
  padding: 6px 10px; border-radius: var(--r-sm);
  transition: all .15s;
}
.topbar-back:hover { color: var(--txt); background: var(--bg3); }
.topbar-sep { color: var(--txt3); }
.topbar-title { color: var(--txt2); font-size: 13px; }
.topbar-model { color: var(--txt); font-size: 13px; font-weight: 600; }
.topbar-use {
  margin-left: auto;
  background: var(--x); color: #fff; border: none; cursor: pointer;
  padding: 8px 18px; border-radius: var(--r-sm); font-size: 13px;
  font-weight: 600; font-family: var(--font-sans);
  transition: opacity .15s; text-decoration: none;
  display: flex; align-items: center; gap: 6px;
}
.topbar-use:hover { opacity: .85; }

/* ── Layout ── */
.page-layout {
  max-width: 1140px; margin: 0 auto;
  display: grid; grid-template-columns: 220px 1fr;
  gap: 40px; padding: 48px 24px 80px;
}
@media (max-width: 800px) {
  .page-layout { grid-template-columns: 1fr; }
  .toc-sidebar { display: none; }
}

/* ── TOC Sidebar ── */
.toc-sidebar { position: sticky; top: 76px; align-self: start; }
.toc-title {
  font-size: 11px; font-weight: 600; letter-spacing: .08em;
  color: var(--txt3); text-transform: uppercase; margin-bottom: 12px;
}
.toc-list { list-style: none; display: flex; flex-direction: column; gap: 2px; }
.toc-list a {
  display: block; padding: 5px 10px;
  font-size: 13px; color: var(--txt2);
  text-decoration: none; border-radius: var(--r-sm);
  border-left: 2px solid transparent;
  transition: all .15s;
}
.toc-list a:hover { color: var(--txt); background: var(--bg3); }
.toc-list a.active { color: var(--x); border-left-color: var(--x); background: rgba(124,131,253,.08); }

/* ── Content ── */
.content { min-width: 0; }

/* Hero */
.hero {
  margin-bottom: 48px;
  padding-bottom: 40px;
  border-bottom: 1px solid var(--brd2);
}
.hero-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 500; padding: 4px 12px;
  border-radius: 99px; border: 1px solid; margin-bottom: 16px;
}
.hero-icon { font-size: 48px; margin-bottom: 16px; }
.hero-title { font-size: 36px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 12px; line-height: 1.2; }
.hero-sub { font-size: 17px; color: var(--txt2); max-width: 640px; margin-bottom: 24px; }
.hero-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.hero-chip {
  font-size: 12px; font-weight: 500; padding: 4px 12px;
  border-radius: 99px; background: var(--bg3); border: 1px solid var(--brd2);
  color: var(--txt2);
}

/* Sections */
.section { margin-bottom: 52px; scroll-margin-top: 76px; }
.section-title {
  font-size: 22px; font-weight: 700; letter-spacing: -.01em;
  margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
}
.section-icon { font-size: 20px; }
.section-body { color: var(--txt2); }
.section-body p { margin-bottom: 14px; }
.section-body p:last-child { margin-bottom: 0; }
.section-body strong { color: var(--txt); font-weight: 600; }

/* Formula box */
.formula-box {
  background: var(--bg2); border: 1px solid var(--brd2);
  border-radius: var(--r-lg); padding: 24px 28px; margin: 20px 0;
}
.formula-label {
  font-size: 11px; font-weight: 600; letter-spacing: .08em;
  color: var(--txt3); text-transform: uppercase; margin-bottom: 12px;
}
.formula-eq {
  font-family: var(--font-mono); font-size: 15px; color: var(--x);
  line-height: 1.8; white-space: pre-wrap;
}
.formula-note { font-size: 13px; color: var(--txt2); margin-top: 12px; }
.formula-note code { font-family: var(--font-mono); font-size: 12px; color: var(--txt); background: var(--bg3); padding: 2px 6px; border-radius: 4px; }

/* Steps */
.steps { display: flex; flex-direction: column; gap: 16px; margin-top: 8px; }
.step {
  display: flex; gap: 16px; align-items: flex-start;
  background: var(--bg2); border: 1px solid var(--brd2);
  border-radius: var(--r-lg); padding: 20px;
}
.step-num {
  flex-shrink: 0; width: 32px; height: 32px;
  background: var(--x); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff;
}
.step-body { flex: 1; }
.step-title { font-weight: 600; margin-bottom: 4px; }
.step-desc { font-size: 13px; color: var(--txt2); }

/* Cards grid */
.cards-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px; margin-top: 8px;
}
.info-card {
  background: var(--bg2); border: 1px solid var(--brd2);
  border-radius: var(--r-lg); padding: 18px;
}
.info-card-icon { font-size: 22px; margin-bottom: 10px; }
.info-card-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.info-card-body { font-size: 13px; color: var(--txt2); line-height: 1.6; }

/* When to use / not use */
.use-list { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.use-item {
  display: flex; align-items: flex-start; gap: 12px;
  background: var(--bg2); border: 1px solid var(--brd2);
  border-radius: var(--r-md); padding: 14px 16px;
  font-size: 14px;
}
.use-item.yes { border-left: 3px solid var(--y); }
.use-item.no  { border-left: 3px solid var(--acc); }
.use-dot { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

/* Metrics grid */
.metrics-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px; margin-top: 8px;
}
.metric-card {
  background: var(--bg2); border: 1px solid var(--brd2);
  border-radius: var(--r-lg); padding: 20px;
}
.metric-name {
  font-family: var(--font-mono); font-size: 13px; font-weight: 600;
  color: var(--x); margin-bottom: 6px;
}
.metric-desc { font-size: 13px; color: var(--txt2); line-height: 1.6; }
.metric-range {
  margin-top: 8px; font-size: 12px; font-weight: 500;
  padding: 3px 8px; border-radius: 99px; display: inline-block;
  background: rgba(124,131,253,.1); color: var(--x);
}

/* Assumptions */
.assumption-list { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.assumption {
  background: var(--bg2); border: 1px solid var(--brd2);
  border-left: 3px solid var(--acc2);
  border-radius: var(--r-md); padding: 14px 16px; font-size: 14px;
}
.assumption strong { color: var(--txt); }
.assumption p { color: var(--txt2); margin-top: 4px; font-size: 13px; }

/* Pitfalls */
.pitfall-list { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.pitfall {
  background: rgba(255,107,138,.05); border: 1px solid rgba(255,107,138,.2);
  border-radius: var(--r-md); padding: 14px 16px; font-size: 14px;
}
.pitfall-title { font-weight: 600; color: var(--acc); margin-bottom: 4px; }
.pitfall-desc { font-size: 13px; color: var(--txt2); }

/* Example */
.example-box {
  background: var(--bg2); border: 1px solid var(--brd2);
  border-radius: var(--r-lg); overflow: hidden; margin-top: 8px;
}
.example-header {
  padding: 14px 20px; background: var(--bg3); border-bottom: 1px solid var(--brd2);
  font-size: 13px; font-weight: 600; color: var(--txt2);
}
.example-body { padding: 20px; }
.example-table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 12px 0; }
.example-table th {
  background: var(--bg3); color: var(--txt2); font-weight: 600;
  padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--brd2);
}
.example-table td { padding: 8px 12px; border-bottom: 1px solid var(--brd); color: var(--txt); }
.example-table tr:last-child td { border-bottom: none; }
.example-result {
  margin-top: 12px; padding: 14px 16px;
  background: rgba(0,212,160,.06); border: 1px solid rgba(0,212,160,.2);
  border-radius: var(--r-md); font-size: 13px; color: var(--txt2);
}
.example-result strong { color: var(--y); }

/* FAQ */
.faq-list { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.faq-item {
  background: var(--bg2); border: 1px solid var(--brd2);
  border-radius: var(--r-lg); overflow: hidden;
}
.faq-q {
  padding: 16px 20px; font-weight: 600; font-size: 14px; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
  user-select: none;
}
.faq-q:hover { background: var(--bg3); }
.faq-arrow { color: var(--txt3); font-size: 12px; transition: transform .2s; }
.faq-item.open .faq-arrow { transform: rotate(180deg); }
.faq-a {
  padding: 0 20px; max-height: 0; overflow: hidden;
  font-size: 13px; color: var(--txt2); line-height: 1.7;
  transition: max-height .25s ease, padding .25s ease;
}
.faq-item.open .faq-a { max-height: 400px; padding: 0 20px 16px; }

/* CTA */
.cta-box {
  background: linear-gradient(135deg, rgba(124,131,253,.12) 0%, rgba(0,212,160,.08) 100%);
  border: 1px solid rgba(124,131,253,.25);
  border-radius: var(--r-xl); padding: 36px 40px; text-align: center; margin-top: 52px;
}
.cta-title { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
.cta-sub { color: var(--txt2); margin-bottom: 24px; }
.cta-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--x); color: #fff; border: none; cursor: pointer;
  padding: 12px 28px; border-radius: var(--r-md); font-size: 15px;
  font-weight: 600; font-family: var(--font-sans);
  text-decoration: none; transition: opacity .15s;
}
.cta-btn:hover { opacity: .85; }

/* Comparison table */
.compare-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
.compare-table th {
  background: var(--bg3); color: var(--txt2); font-weight: 600;
  padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--brd2);
}
.compare-table td { padding: 10px 14px; border-bottom: 1px solid var(--brd); color: var(--txt); vertical-align: top; }
.compare-table tr:last-child td { border-bottom: none; }
.compare-table .good { color: var(--y); }
.compare-table .bad { color: var(--acc); }
</style>
</head>

<div class="page-layout">

  <main class="content" id="content"></main>
</div>

<script>
// ─────────────────────────────────────────
//  MODEL DATA
// ─────────────────────────────────────────
const MODELS = {

  linear: {
    id: 'linear',
    panel: 'nova',
    icon: '📈',
    name: 'Regressão Linear Simples',
    category: 'Regressão Contínua',
    level: 'Iniciante',
    levelColor: '#4CAF50',
    badgeStyle: 'background:rgba(124,131,253,.12);color:#7C83FD;border-color:rgba(124,131,253,.3)',
    sub: 'O modelo mais fundamental da estatística. Estima a relação entre uma única variável preditora e uma variável resposta contínua.',
    chips: ['1 variável preditora', 'Variável resposta contínua', 'OLS', 'Interpretação direta'],

    sections: [
      {
        id: 'oque',
        icon: '🔍',
        title: 'O que é',
        html: `
          <p>A Regressão Linear Simples é o modelo estatístico mais básico e amplamente utilizado. Ela descreve a relação entre <strong>uma variável independente X</strong> (preditora) e <strong>uma variável dependente Y</strong> (resposta) por meio de uma reta.</p>
          <p>O objetivo é encontrar a reta que melhor se ajusta aos dados, minimizando a distância vertical entre os pontos observados e a reta — esse método se chama <strong>Mínimos Quadrados Ordinários (OLS)</strong>.</p>
          <p>A reta resultante pode ser usada tanto para <strong>entender a relação</strong> entre X e Y quanto para <strong>fazer previsões</strong> de Y para novos valores de X não observados.</p>
        `
      },
      {
        id: 'matematica',
        icon: '📐',
        title: 'Fundamentos matemáticos',
        formula: {
          label: 'Equação da reta',
          eq: `Ŷ = β₀ + β₁·X + ε

β₁ = Σ(xᵢ − x̄)(yᵢ − ȳ) / Σ(xᵢ − x̄)²
β₀ = ȳ − β₁·x̄`,
          note: `Onde <code>β₀</code> é o intercepto (valor de Y quando X=0), <code>β₁</code> é a inclinação (quanto Y muda por unidade de X), e <code>ε</code> é o termo de erro (resíduo).`
        },
        html: `
          <p>O método OLS minimiza a <strong>Soma dos Quadrados dos Resíduos (SQR)</strong>: Σ(yᵢ − Ŷᵢ)². A solução analítica garante que os estimadores β₀ e β₁ sejam os melhores estimadores lineares não-viesados (Teorema de Gauss-Markov), desde que as suposições do modelo sejam satisfeitas.</p>
        `
      },
      {
        id: 'como-funciona',
        icon: '⚙️',
        title: 'Como funciona passo a passo',
        steps: [
          { title: 'Calcular as médias', desc: 'Calcula x̄ (média de X) e ȳ (média de Y) a partir dos dados.' },
          { title: 'Estimar β₁ (inclinação)', desc: 'Divide a covariância de X e Y pela variância de X. Mede o quanto Y cresce para cada unidade de X.' },
          { title: 'Estimar β₀ (intercepto)', desc: 'Garante que a reta passe pelo ponto (x̄, ȳ), que é sempre o centro de qualquer regressão OLS.' },
          { title: 'Calcular os resíduos', desc: 'eᵢ = yᵢ − Ŷᵢ. Os resíduos devem ter distribuição aproximadamente normal e variância constante.' },
          { title: 'Avaliar com métricas', desc: 'Calcular R², p-valor, IC 95%, estatística F e distância de Cook para validar o modelo.' },
        ]
      },
      {
        id: 'quando-usar',
        icon: '✅',
        title: 'Quando usar (e quando não usar)',
        uses: [
          { yes: true, text: 'Relação esperada entre X e Y é aproximadamente linear' },
          { yes: true, text: 'Y é uma variável contínua (peso, preço, temperatura, salário)' },
          { yes: true, text: 'Você tem apenas um preditor e quer interpretação simples' },
          { yes: true, text: 'Tamanho de amostra pequeno a médio, sem alta dimensionalidade' },
          { yes: false, text: 'Y é binário ou categórico → use Regressão Logística' },
          { yes: false, text: 'Relação claramente curvilínea → use Regressão Polinomial' },
          { yes: false, text: 'Dados com muitos outliers severos → use Regressão Quantílica' },
          { yes: false, text: 'Múltiplas variáveis preditoras → use Regressão Múltipla' },
        ]
      },
      {
        id: 'suposicoes',
        icon: '📋',
        title: 'Suposições do modelo',
        assumptions: [
          { title: 'Linearidade', desc: 'A relação entre X e Y deve ser linear. Verifique com o gráfico de dispersão e o plot de resíduos vs. valores ajustados.' },
          { title: 'Independência dos erros', desc: 'Os resíduos não devem ser correlacionados entre si (sem autocorrelação). Importante em séries temporais.' },
          { title: 'Homocedasticidade', desc: 'A variância dos resíduos deve ser constante ao longo de todos os valores de X (sem padrão de "cone").' },
          { title: 'Normalidade dos resíduos', desc: 'Os resíduos devem seguir aproximadamente uma distribuição normal. Importante para intervalos de confiança válidos.' },
        ]
      },
      {
        id: 'metricas',
        icon: '📊',
        title: 'Métricas explicadas',
        metrics: [
          { name: 'R²', desc: 'Proporção da variância de Y explicada pelo modelo. R²=1 é ajuste perfeito. R²=0 significa que o modelo não explica nada além da média.', range: '0 a 1 (maior = melhor)' },
          { name: 'R² Ajustado', desc: 'Versão penalizada do R² que desconta a adição de variáveis desnecessárias. Sempre use este em modelos com múltiplos preditores.', range: '≤ R²' },
          { name: 'p-valor', desc: 'Probabilidade de observar β₁ tão extremo se o coeficiente verdadeiro fosse zero. p < 0.05 → rejeitar H₀ de β₁ = 0.', range: '< 0.05 para significância' },
          { name: 'IC 95%', desc: 'Intervalo de confiança de 95% para β₁. Se não incluir zero, o coeficiente é estatisticamente significativo.', range: 'Quanto mais estreito, melhor' },
          { name: 'F-estatístico', desc: 'Testa se o modelo como um todo é significativo (todos os coeficientes = 0). Para regressão simples, equivale ao quadrado do t-estatístico de β₁.', range: 'p(F) < 0.05 para modelo válido' },
          { name: "Cook's Distance", desc: 'Mede a influência de cada observação no ajuste. Valores > 0.5 indicam pontos influentes que podem distorcer os coeficientes.', range: '< 0.5 é saudável' },
        ]
      },
      {
        id: 'armadilhas',
        icon: '⚠️',
        title: 'Armadilhas comuns',
        pitfalls: [
          { title: 'Correlação ≠ Causalidade', desc: 'R² alto não significa que X causa Y. Sempre valide com conhecimento do domínio.' },
          { title: 'Extrapolação perigosa', desc: 'Prever valores de Y para X muito fora do intervalo dos dados de treino é arriscado — a linearidade pode não valer nessa região.' },
          { title: 'Outliers inflacionam erros', desc: 'Um único ponto extremo pode puxar toda a reta. Verifique a distância de Cook e considere tratamento de outliers.' },
          { title: 'Omitir variáveis importantes', desc: 'Se uma variável relevante está ausente, os coeficientes ficam viesados (viés de variável omitida).' },
        ]
      },
      {
        id: 'exemplo',
        icon: '🧪',
        title: 'Exemplo prático',
        example: {
          header: 'Caso: Prever salário com base em anos de experiência',
          tableHeaders: ['Experiência (anos)', 'Salário (R$ mil)'],
          tableRows: [
            ['1', '38'], ['2', '42'], ['3', '46'], ['5', '54'], ['7', '62'], ['10', '74'],
          ],
          resultHtml: `Ajustando OLS: <strong>Ŷ = 34.8 + 3.9 · X</strong><br>
Para 8 anos de experiência → Ŷ = 34.8 + 3.9 × 8 = <strong>R$ 66.0 mil</strong><br>
R² = 0.998 — o modelo explica 99.8% da variação salarial com anos de experiência.`
        }
      },
      {
        id: 'faq',
        icon: '❓',
        title: 'Perguntas frequentes',
        faqs: [
          { q: 'Qual o tamanho mínimo de amostra?', a: 'A regra prática é pelo menos 10–20 observações por preditor. Para regressão simples, n ≥ 30 costuma ser suficiente para os testes serem confiáveis.' },
          { q: 'O que fazer se R² for baixo?', a: 'Primeiro verifique se a relação é mesmo linear (talvez use polinomial). Depois considere se faltam preditores importantes (use regressão múltipla). R² baixo não invalida o modelo se o p-valor do coeficiente for significativo.' },
          { q: 'Como interpretar β₁ negativo?', a: 'Significa que Y diminui quando X aumenta. Por exemplo, β₁ = −2 indica que cada unidade extra de X está associada a uma redução de 2 unidades em Y.' },
          { q: 'Posso usar com dados categóricos em X?', a: 'X precisa ser numérico. Variáveis categórias em X devem ser convertidas em variáveis dummy (0/1). Para Y categórico, use regressão logística.' },
        ]
      },
    ]
  },

  multipla: {
    id: 'multipla',
    panel: 'multipla',
    icon: '📊',
    name: 'Regressão Múltipla',
    category: 'Regressão Contínua',

          <p><strong>Lasso (L1)</strong>: penaliza a soma dos valores absolutos. Tem o efeito de <strong>zerar coeficientes irrelevantes</strong>, fazendo seleção automática de variáveis. Ideal quando você suspeita que muitas variáveis são espúrias.</p>

// ─────────────────────────────────────────
//  RENDER ENGINE
// ─────────────────────────────────────────
function renderSection(sec) {
  let html = `<section class="section" id="${sec.id}">
    <h2 class="section-title"><span class="section-icon">${sec.icon}</span>${sec.title}</h2>`;

  if (sec.html) {
    html += `<div class="section-body">${sec.html}</div>`;
  }

  if (sec.formula) {
    html += `<div class="formula-box">
      <div class="formula-label">${sec.formula.label}</div>
      <div class="formula-eq">${sec.formula.eq}</div>
      ${sec.formula.note ? `<div class="formula-note">${sec.formula.note}</div>` : ''}
    </div>`;
  }

  if (sec.steps) {
    html += `<div class="steps">` + sec.steps.map((s,i) =>
      `<div class="step">
        <div class="step-num">${i+1}</div>
        <div class="step-body">
          <div class="step-title">${s.title}</div>
          <div class="step-desc">${s.desc}</div>
        </div>
      </div>`).join('') + `</div>`;
  }

  if (sec.uses) {
    html += `<div class="use-list">` + sec.uses.map(u =>
      `<div class="use-item ${u.yes ? 'yes' : 'no'}">
        <span class="use-dot">${u.yes ? '✅' : '❌'}</span>
        <span>${u.text}</span>
      </div>`).join('') + `</div>`;
  }

  if (sec.assumptions) {
    html += `<div class="assumption-list">` + sec.assumptions.map(a =>
      `<div class="assumption">
        <strong>${a.title}</strong>
        <p>${a.desc}</p>
      </div>`).join('') + `</div>`;
  }

  if (sec.metrics) {
    html += `<div class="metrics-grid">` + sec.metrics.map(m =>
      `<div class="metric-card">
        <div class="metric-name">${m.name}</div>
        <div class="metric-desc">${m.desc}</div>
        <span class="metric-range">${m.range}</span>
      </div>`).join('') + `</div>`;
  }

  if (sec.compareTable) {
    const t = sec.compareTable;
    html += `<div style="overflow-x:auto"><table class="compare-table">
      <thead><tr>${t.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>`;
  }

  if (sec.pitfalls) {
    html += `<div class="pitfall-list">` + sec.pitfalls.map(p =>
      `<div class="pitfall">
        <div class="pitfall-title">⚠️ ${p.title}</div>
        <div class="pitfall-desc">${p.desc}</div>
      </div>`).join('') + `</div>`;
  }

  if (sec.example) {
    const ex = sec.example;
    html += `<div class="example-box">
      <div class="example-header">${ex.header}</div>
      <div class="example-body">
        <table class="example-table">
          <thead><tr>${ex.tableHeaders.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
          <tbody>${ex.tableRows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
        <div class="example-result">${ex.resultHtml}</div>
      </div>
    </div>`;
  }

  if (sec.faqs) {
    html += `<div class="faq-list">` + sec.faqs.map((f,i) =>
      `<div class="faq-item" id="faq-${i}">
        <div class="faq-q" onclick="toggleFaq('faq-${i}')">
          <span>${f.q}</span>
          <span class="faq-arrow">▼</span>
        </div>
        <div class="faq-a">${f.a}</div>
      </div>`).join('') + `</div>`;
  }

  html += `</section>`;
  return html;
}

function toggleFaq(id) {
  const el = document.getElementById(id);
  el.classList.toggle('open');
}

function init() {
  const params = new URLSearchParams(window.location.search);
  const modelId = params.get('modelo') || 'linear';
  const model = MODELS[modelId];

  if (!model) {
    document.getElementById('content').innerHTML = `<p style="color:var(--acc)">Modelo não encontrado.</p>`;
    return;
  }

  document.title = `${model.name} · Slope`;
  document.getElementById('nav-model-name').textContent = model.name;

  const useBtn = document.getElementById('nav-use-btn');
  useBtn.href = `../index.html#panel-${model.panel}`;
  useBtn.style.background = model.id === 'logistica' ? 'var(--acc)' :
                             model.id === 'regularizada' ? '#4DD0E1' :
                             model.id === 'quantilica' ? '#CE93D8' :
                             model.id === 'serie' ? '#4FC3F7' :
                             model.id === 'polinomial' ? 'var(--acc2)' : 'var(--x)';
  if (['acc2','#FFC254'].includes(useBtn.style.background)) useBtn.style.color = '#000';

  // Build TOC
  const toc = document.getElementById('toc-list');
  model.sections.forEach(sec => {
    const li = document.createElement('li');
    li.innerHTML = `<a href="#${sec.id}">${sec.title}</a>`;
    toc.appendChild(li);
  });

  // Build hero
  let heroHtml = `
    <div class="hero">
      <span class="hero-badge" style="${model.badgeStyle}">${model.icon} ${model.category}</span>
      <div class="hero-title">${model.name}</div>
      <div class="hero-sub">${model.sub}</div>
      <div class="hero-chips">
        ${model.chips.map(c=>`<span class="hero-chip">${c}</span>`).join('')}
        <span class="hero-chip" style="color:${model.levelColor};border-color:${model.levelColor}22;background:${model.levelColor}15">Nível: ${model.level}</span>
      </div>
    </div>`;

  // Build sections
  let sectionsHtml = model.sections.map(renderSection).join('');

  // CTA
  let ctaHtml = `
    <div class="cta-box">
      <div class="cta-title">Pronto para experimentar?</div>
      <div class="cta-sub">Importe seus dados e aplique ${model.name} com um clique na plataforma.</div>
      <a class="cta-btn" href="../index.html">Abrir plataforma →</a>
    </div>`;

  document.getElementById('content').innerHTML = heroHtml + sectionsHtml + ctaHtml;

  // TOC active on scroll
  const sections = document.querySelectorAll('.section');
  const tocLinks = toc.querySelectorAll('a');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        tocLinks.forEach(a => a.classList.remove('active'));
        const active = toc.querySelector(`a[href="#${entry.target.id}"]`);
        if (active) active.classList.add('active');
      }
    });
  }, { rootMargin: '-20% 0px -70% 0px' });
  sections.forEach(s => observer.observe(s));
}

init();
</script>
