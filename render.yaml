services:
  - type: web
    name: site-rl-backend
    env: node
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: STOCK_PROVIDER
        value: yahoo
